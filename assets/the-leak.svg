<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Today your accounts are already linked. Different wallets used on Uniswap, Aave and ENS all read from RPC providers that log the same IP, so a provider ties them to one person.">
  <defs>
    <style>.t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}.card{fill:#121820;stroke:#242c38}</style>
  </defs>
  <rect width="860" height="330" rx="18" fill="#06090d"/>
  <rect x="0.5" y="0.5" width="859" height="329" rx="17.5" fill="none" stroke="#1b2531"/>

  <text class="t" x="34" y="42" font-size="20" font-weight="700" fill="#eef3f8">Today: your accounts are already linked</text>
  <text class="t" x="34" y="65" font-size="12.5" fill="#9aa7b7">Your apps read straight to RPC providers that log your IP. One IP across every account ties them to one person.</text>

  <!-- converging lanes: each account's reads flow to the provider -->
  <path id="lA" d="M276,120 C 420,120 470,180 548,180" fill="none" stroke="#D9674E" stroke-width="2" stroke-opacity="0.38"/>
  <path id="lB" d="M276,180 L548,180" fill="none" stroke="#D9674E" stroke-width="2" stroke-opacity="0.38"/>
  <path id="lC" d="M276,240 C 420,240 470,180 548,180" fill="none" stroke="#D9674E" stroke-width="2" stroke-opacity="0.38"/>
  <g><circle r="4" fill="#E6795F"/><animateMotion dur="2.2s" repeatCount="indefinite"><mpath xlink:href="#lA"/></animateMotion></g>
  <g><circle r="4" fill="#E6795F"/><animateMotion dur="2.2s" begin="-0.7s" repeatCount="indefinite"><mpath xlink:href="#lB"/></animateMotion></g>
  <g><circle r="4" fill="#E6795F"/><animateMotion dur="2.2s" begin="-1.4s" repeatCount="indefinite"><mpath xlink:href="#lC"/></animateMotion></g>

  <!-- accounts, each on a well-known app -->
  <g class="t">
    <rect class="card" x="34" y="96" width="242" height="48" rx="11"/>
    <circle cx="58" cy="120" r="8" fill="#E7E7EA"/>
    <text x="76" y="116" font-size="13" fill="#eef3f8">Main wallet</text>
    <text class="m" x="76" y="133" font-size="10.5" fill="#67727f">on app.uniswap.org</text>

    <rect class="card" x="34" y="156" width="242" height="48" rx="11"/>
    <circle cx="58" cy="180" r="8" fill="#9A9EA4"/>
    <text x="76" y="176" font-size="13" fill="#eef3f8">Trading wallet</text>
    <text class="m" x="76" y="193" font-size="10.5" fill="#67727f">on app.aave.com</text>

    <rect class="card" x="34" y="216" width="242" height="48" rx="11"/>
    <circle cx="58" cy="240" r="8" fill="#63676E"/>
    <text x="76" y="236" font-size="13" fill="#eef3f8">Airdrop wallet</text>
    <text class="m" x="76" y="253" font-size="10.5" fill="#67727f">on app.ens.domains</text>
  </g>

  <!-- what the provider logs -->
  <rect class="card" x="548" y="92" width="278" height="188" rx="13"/>
  <text class="t" x="568" y="118" font-size="12.5" font-weight="600" fill="#cfd8e3">What the provider logs</text>

  <g class="m" font-size="11.5">
    <text x="568" y="148" fill="#9aa7b7">uniswap · Main</text>
    <text x="806" y="148" text-anchor="end" fill="#E6795F">203.0.113.7</text>
    <text x="568" y="174" fill="#9aa7b7">aave · Trading</text>
    <text x="806" y="174" text-anchor="end" fill="#E6795F">203.0.113.7</text>
    <text x="568" y="200" fill="#9aa7b7">ens · Airdrops</text>
    <text x="806" y="200" text-anchor="end" fill="#E6795F">203.0.113.7</text>
  </g>

  <line x1="568" y1="218" x2="806" y2="218" stroke="#242c38"/>
  <text class="t" x="568" y="240" font-size="11.5" fill="#9aa7b7">Same IP on every read</text>
  <text class="t" x="568" y="262" font-size="13" font-weight="700" fill="#E6795F">one person · 3 wallets · one location</text>

  <text class="t" x="430" y="312" font-size="11.5" fill="#5a6572" text-anchor="middle">Many popular dapps share the same few providers, so the link follows you across all of them.</text>
</svg>
