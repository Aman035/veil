<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="activity.css" />
  <title>Veil - Live activity</title>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div class="brand"><span class="mark"></span> Veil <span class="crumb">Live activity</span></div>
      <div class="counter"><b id="count">0</b> reads carried over Tor</div>
    </header>
    <p class="lede">Every JSON-RPC read your open apps make, as Veil intercepts it and routes it. Open a dapp (try <b>stake.lido.fi</b>) and watch its reads stream in.</p>

    <div class="head">
      <span class="t">time</span><span class="app">app</span><span class="m">read</span><span class="r">route</span><span class="s">how it went out</span>
    </div>
    <div id="list" class="list"></div>
    <div id="empty" class="empty">Waiting for reads. Open or refresh a dapp in another tab.</div>
  </main>
  <script src="activity.js"></script>
</body>
</html>
