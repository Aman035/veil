<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 206" width="820" height="206" role="img" aria-label="Step 2: anon-rpc carries it over Tor. Veil hands the read to the anon-rpc harness, which reaches the provider over Tor with one circuit per account.">
  <defs><style>.t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}.box{fill:#16181c;stroke:#2a2e35}.lbl{fill:#ededee;font-weight:600}.sub{fill:#9a9ea4}</style></defs>
  <rect width="820" height="206" rx="18" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="819" height="205" rx="17.5" fill="none" stroke="#23262b"/>
  <text class="t" x="32" y="40" font-size="19" font-weight="700" fill="#ededee">2 &#183; anon-rpc carries it over Tor</text>
  <text class="t sub" x="32" y="61" font-size="12.5">Veil hands the read to the anon-rpc harness, which reaches the provider over Tor.</text>

  <!-- anon-rpc region (lighter border to stand out) -->
  <rect x="188" y="96" width="416" height="70" rx="13" fill="#101316" stroke="#4b5059"/>
  <text class="t" x="396" y="188" font-size="12.5" text-anchor="middle" fill="#ededee" font-weight="600">anon-rpc + tor-js</text>

  <path id="f2" d="M60 128 H 764" fill="none" stroke="none"/>
  <g><circle r="4.5" fill="#ededee"/><animateMotion dur="3.4s" repeatCount="indefinite"><mpath xlink:href="#f2"/></animateMotion></g>

  <g class="t">
    <rect class="box" x="26" y="104" width="138" height="48" rx="11"/>
    <text class="lbl" x="95" y="126" font-size="13" text-anchor="middle">Veil</text>
    <text class="sub" x="95" y="143" font-size="10.5" text-anchor="middle">routed read</text>

    <rect class="box" x="200" y="104" width="196" height="48" rx="11"/>
    <text class="lbl" x="298" y="126" font-size="13" text-anchor="middle">anon-rpc harness</text>
    <text class="sub" x="298" y="143" font-size="10.5" text-anchor="middle">sandboxed, hash-pinned</text>

    <rect class="box" x="412" y="104" width="180" height="48" rx="11"/>
    <text class="lbl" x="502" y="126" font-size="13" text-anchor="middle">Tor</text>
    <text class="sub" x="502" y="143" font-size="10.5" text-anchor="middle">one circuit per account</text>

    <rect class="box" x="640" y="104" width="152" height="48" rx="11"/>
    <text class="lbl" x="716" y="131" font-size="13" text-anchor="middle">provider</text>
  </g>
  <g fill="#454b54">
    <path d="M164 128 l16 0 M174 124 l6 4 -6 4"/>
    <path d="M604 128 l28 0 M628 124 l6 4 -6 4"/>
  </g>
</svg>
