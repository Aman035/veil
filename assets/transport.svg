<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Step 2: anon-rpc carries it over Tor. Veil hands the routed read to the anon-rpc harness, a sandboxed hash-pinned tor-js worker, which reaches the provider over Tor with one circuit per account.">
  <defs><style>.t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}.box{fill:#16181c;stroke:#2a2e35}.lbl{fill:#ededee;font-weight:600}.sub{fill:#9a9ea4}.step{fill:#5f636a}</style></defs>
  <rect width="880" height="250" rx="18" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="249" rx="17.5" fill="none" stroke="#23262b"/>
  <text class="t" x="32" y="40" font-size="19" font-weight="700" fill="#ededee">2 &#183; anon-rpc carries it over Tor</text>
  <text class="t sub" x="32" y="61" font-size="12.5">Veil hands the routed read to the anon-rpc harness: a sandboxed, hash-pinned tor-js worker.</text>

  <!-- anon-rpc region (lighter border to stand out in mono) -->
  <rect x="206" y="92" width="438" height="96" rx="13" fill="#101316" stroke="#4b5059"/>
  <text class="t" x="425" y="210" font-size="12" text-anchor="middle" fill="#ededee">anon-rpc + tor-js <tspan class="step">(the Ethereum Foundation's anonymising client)</tspan></text>

  <path id="f2" d="M60 132 H 820" fill="none" stroke="none"/>
  <g><circle r="4.5" fill="#ededee"/><animateMotion dur="3.6s" repeatCount="indefinite"><mpath xlink:href="#f2"/></animateMotion></g>

  <g class="t">
    <rect class="box" x="26" y="106" width="150" height="54" rx="11"/>
    <text class="lbl" x="101" y="130" font-size="13" text-anchor="middle">Veil</text>
    <text class="sub" x="101" y="147" font-size="10.5" text-anchor="middle">routed read</text>

    <rect class="box" x="216" y="106" width="212" height="54" rx="11"/>
    <text class="lbl" x="322" y="128" font-size="13" text-anchor="middle">anon-rpc harness</text>
    <text class="sub" x="322" y="145" font-size="10" text-anchor="middle">sandboxed worker &#183; tor-js, hash-pinned</text>

    <rect class="box" x="452" y="106" width="172" height="54" rx="11"/>
    <text class="lbl" x="538" y="128" font-size="13" text-anchor="middle">Tor</text>
    <text class="sub" x="538" y="145" font-size="10" text-anchor="middle">via KPS gateway &#183; 1 circuit / account</text>

    <rect class="box" x="672" y="106" width="172" height="54" rx="11"/>
    <text class="lbl" x="758" y="130" font-size="13" text-anchor="middle">provider</text>
    <text class="sub" x="758" y="147" font-size="10.5" text-anchor="middle">RPC endpoint</text>
  </g>

  <g class="m step" font-size="9.5" text-anchor="middle"><text x="196" y="100">worker.fetch(key)</text></g>
  <g fill="#454b54">
    <path d="M176 133 l16 0 M186 129 l6 4 -6 4"/>
    <path d="M428 133 l16 0 M438 129 l6 4 -6 4"/>
    <path d="M624 133 l40 0 M660 129 l6 4 -6 4"/>
  </g>
</svg>
