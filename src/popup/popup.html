<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Veil</title>
</head>
<body>
  <main id="app" class="app" data-state="off">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <span class="name">Veil</span>
      </div>
      <button id="toggle" class="switch" role="switch" aria-checked="false" aria-label="Toggle protection">
        <span class="knob"></span>
      </button>
    </header>

    <section class="status">
      <span class="dot" aria-hidden="true"></span>
      <span id="statusText" class="status-text">Off</span>
      <span id="statusSub" class="status-sub"></span>
    </section>

    <div id="bootProgress" class="boot" aria-hidden="true">
      <div class="boot-track"><span id="bootFill" class="boot-fill"></span></div>
      <div id="bootStep" class="boot-step">starting the private worker</div>
    </div>

    <section id="tabCard" class="card tab-card">
      <div class="card-label">This tab</div>
      <div id="tabOrigin" class="tab-origin">-</div>
      <ul class="facts">
        <li><b id="tabProtected">0</b> requests protected</li>
        <li id="tabRoutes" class="muted">waiting for activity…</li>
        <li id="tabReroute" class="reroute hidden">Provider blocks Tor → re-routed (safe)</li>
        <li id="tabBlocked" class="blocked hidden"><b>0</b> blocked (kept private)</li>
        <li id="tabDirect" class="direct hidden"><b>0</b> sent direct (you allowed it)</li>
      </ul>

    </section>

    <section class="card today">
      <div class="today-row">
        <span>Today</span>
        <span><b id="todayReq">0</b> requests · <b id="todaySites">0</b> sites</span>
      </div>
    </section>

    <footer class="honesty">
      <button id="openActivity" class="settings-link">Live activity</button>
      <button id="openSettings" class="settings-link">Settings</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
