<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Veil logo">
  <rect x="6" y="6" width="84" height="84" rx="24" fill="#0b0d11"/>
  <rect x="6.5" y="6.5" width="83" height="83" rx="23.5" fill="none" stroke="#E7E7EA" stroke-opacity="0.5"/>

  <!-- veil: a draped arc over the routes -->
  <path d="M26 34 Q48 22 70 34" fill="none" stroke="#E7E7EA" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <path d="M30 42 Q48 32 66 42" fill="none" stroke="#E7E7EA" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- two routes converging to one node (the V of Veil) -->
  <path d="M30 44 L48 70" fill="none" stroke="#E7E7EA" stroke-width="7" stroke-linecap="round"/>
  <path d="M66 44 L48 70" fill="none" stroke="#E7E7EA" stroke-width="7" stroke-linecap="round"/>

  <!-- the identity node at the vertex -->
  <circle cx="48" cy="70" r="6" fill="#F2F2F3"/>
</svg>
