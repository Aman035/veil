<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 360" width="980" height="360" role="img" aria-label="Architecture: dapp page, Veil extension routes by account and blinds the id, anon-rpc harness runs a sandboxed hash-pinned tor-js worker, over Tor one circuit per account, to the provider.">
  <defs>
    <style>
      .t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
      .m{font-family:ui-monospace,"SF Mono",Menlo,monospace}
      .box{fill:#121820;stroke:#2a3647}
      .lbl{fill:#eef3f8;font-weight:600}
      .sub{fill:#9aa7b7}
      .step{fill:#63707f}
      .bk{fill:none;stroke:#2a3647;stroke-width:1.4}
    </style>
  </defs>
  <rect width="980" height="360" rx="18" fill="#06090d"/>
  <rect x="0.5" y="0.5" width="979" height="359" rx="17.5" fill="none" stroke="#1b2531"/>
  <text class="t" x="34" y="42" font-size="20" font-weight="700" fill="#eef3f8">How it works</text>
  <text class="t sub" x="34" y="64" font-size="13">Veil does interception + routing; anon-rpc + tor-js do the anonymising transport.</text>

  <!-- travelling packet along the request path -->
  <path id="path" d="M176 150 H 952" fill="none" stroke="none"/>
  <g>
    <circle r="9" fill="#C9A24B" opacity="0.22"/><circle r="4.5" fill="#DFBE7E"/>
    <animateMotion dur="3.6s" repeatCount="indefinite"><mpath xlink:href="#path"/></animateMotion>
  </g>

  <!-- highlighted anon-rpc region -->
  <rect x="402" y="112" width="368" height="118" rx="14" fill="#C9A24B" fill-opacity="0.05" stroke="#C9A24B" stroke-opacity="0.45"/>

  <!-- nodes -->
  <g class="t">
    <!-- 1 dapp -->
    <rect class="box" x="26" y="118" width="150" height="64" rx="12"/>
    <text class="lbl" x="101" y="146" font-size="13.5" text-anchor="middle">dapp page</text>
    <text class="sub m" x="101" y="164" font-size="10" text-anchor="middle">sends a read</text>

    <!-- 2 veil -->
    <rect class="box" x="226" y="118" width="166" height="64" rx="12"/>
    <text class="lbl" x="309" y="144" font-size="13.5" text-anchor="middle">Veil extension</text>
    <text class="sub" x="309" y="160" font-size="10" text-anchor="middle">pick the account,</text>
    <text class="sub" x="309" y="172" font-size="10" text-anchor="middle">blind the request id</text>

    <!-- 3 harness -->
    <rect class="box" x="418" y="124" width="196" height="94" rx="12" stroke="#C9A24B" stroke-opacity="0.6"/>
    <text class="lbl" x="516" y="150" font-size="13.5" text-anchor="middle">anon-rpc harness</text>
    <text class="sub" x="516" y="167" font-size="10" text-anchor="middle">sandboxed Web Worker</text>
    <text class="sub" x="516" y="179" font-size="10" text-anchor="middle">runs tor-js (hash-pinned</text>
    <text class="sub" x="516" y="191" font-size="10" text-anchor="middle">on chain, verified)</text>

    <!-- 4 gateway/tor -->
    <rect class="box" x="640" y="124" width="112" height="94" rx="12" stroke="#C9A24B" stroke-opacity="0.6"/>
    <text class="lbl" x="696" y="150" font-size="13.5" text-anchor="middle" fill="#C9A24B">Tor</text>
    <text class="sub" x="696" y="167" font-size="10" text-anchor="middle">via KPS</text>
    <text class="sub" x="696" y="179" font-size="10" text-anchor="middle">gateway,</text>
    <text class="sub" x="696" y="191" font-size="10" text-anchor="middle">1 circuit / account</text>

    <!-- 5 provider -->
    <rect class="box" x="800" y="118" width="150" height="64" rx="12"/>
    <text class="lbl" x="875" y="146" font-size="13.5" text-anchor="middle">provider</text>
    <text class="sub m" x="875" y="164" font-size="10" text-anchor="middle">RPC endpoint</text>
  </g>

  <!-- arrows + step labels -->
  <g class="m step" font-size="10" text-anchor="middle">
    <text x="201" y="138">intercept</text>
    <text x="405" y="112">worker.fetch</text>
    <text x="405" y="124">(isolationKey)</text>
    <text x="776" y="138">over Tor</text>
  </g>
  <g fill="#3a4757">
    <path d="M176 150 h14 M186 146 l6 4 -6 4"/>
    <path d="M614 160 h20 M630 156 l6 4 -6 4"/>
    <path d="M752 150 h42 M790 146 l6 4 -6 4"/>
  </g>

  <!-- region brackets -->
  <path class="bk" d="M26 198 V 210 H 392 V 198"/>
  <text class="t" x="209" y="230" font-size="12" text-anchor="middle" fill="#9aa7b7">Veil  <tspan class="step" font-size="10.5">(this repo: interception, routing, policy)</tspan></text>

  <path class="bk" d="M418 232 V 244 H 752 V 232" stroke="#C9A24B" stroke-opacity="0.5"/>
  <text class="t" x="585" y="264" font-size="12" text-anchor="middle" fill="#C9A24B">anon-rpc + tor-js  <tspan fill="#63707f" font-size="10.5">(the Ethereum Foundation's anonymising client)</tspan></text>

  <!-- fallback -->
  <path d="M875 182 V 300 H 309 V 182" fill="none" stroke="#2a3647" stroke-width="1.4" stroke-dasharray="4 5"/>
  <text class="t" x="590" y="322" font-size="11.5" text-anchor="middle" fill="#9aa7b7">provider blocks Tor? <tspan fill="#C9A24B">re-route to a Tor-friendly provider</tspan>, same chain, only after a real block.</text>
  <text class="t" x="590" y="340" font-size="11" text-anchor="middle" fill="#63707f">can't re-route? Veil asks you, per site. Never silently direct.</text>
</svg>
