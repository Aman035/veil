<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Veil - private by default for the wallets and dapps you already use">
  <defs>
    <style>.t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}</style>
  </defs>

  <rect width="1280" height="360" rx="20" fill="#0b0d11"/>

  <!-- ambient routes (solid, faint) -->
  <path id="bA" d="M-40 96 C 360 60 820 60 1320 96" fill="none" stroke="#E7E7EA" stroke-width="2" stroke-opacity="0.26"/>
  <path id="bB" d="M-40 276 C 360 300 820 300 1320 276" fill="none" stroke="#63676E" stroke-width="2" stroke-opacity="0.2"/>
  <g><circle r="4" fill="#E7E7EA"/><animateMotion dur="5s" repeatCount="indefinite"><mpath xlink:href="#bA"/></animateMotion></g>
  <g><circle r="4" fill="#63676E"/><animateMotion dur="6s" begin="-2.5s" repeatCount="indefinite"><mpath xlink:href="#bB"/></animateMotion></g>
  <g><circle r="4" fill="#E7E7EA"/><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite"><mpath xlink:href="#bA"/></animateMotion></g>

  <!-- logo mark (flat) -->
  <g transform="translate(70,104) scale(1.55)">
    <rect x="6" y="6" width="84" height="84" rx="24" fill="#07090c"/>
    <rect x="6.5" y="6.5" width="83" height="83" rx="23.5" fill="none" stroke="#E7E7EA" stroke-opacity="0.5"/>
    <path d="M26 34 Q48 22 70 34" fill="none" stroke="#E7E7EA" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M30 42 Q48 32 66 42" fill="none" stroke="#E7E7EA" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
    <path d="M30 44 L48 70" fill="none" stroke="#E7E7EA" stroke-width="7" stroke-linecap="round"/>
    <path d="M66 44 L48 70" fill="none" stroke="#E7E7EA" stroke-width="7" stroke-linecap="round"/>
    <circle cx="48" cy="70" r="6" fill="#F2F2F3"/>
  </g>

  <!-- wordmark + tagline -->
  <text class="t" x="232" y="158" font-size="76" font-weight="800" fill="#eef3f8" letter-spacing="-2">Veil</text>
  <text class="t" x="236" y="208" font-size="22" fill="#c6d2df">Private by default for the wallets and dapps you already use.</text>
  <text class="m" x="236" y="244" font-size="15" fill="#E7E7EA">one route per account  ·  over Tor  ·  built on anon-rpc</text>
</svg>
