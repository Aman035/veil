<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="Step 1: Veil catches the read. The dapp page's fetch is intercepted; Veil reads the account and blinds the request id.">
  <defs><style>.t{font-family:-apple-system,"Segoe UI",Roboto,sans-serif}.m{font-family:ui-monospace,"SF Mono",Menlo,monospace}.box{fill:#16181c;stroke:#2a2e35}.lbl{fill:#ededee;font-weight:600}.sub{fill:#9a9ea4}</style></defs>
  <rect width="760" height="210" rx="18" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="759" height="209" rx="17.5" fill="none" stroke="#23262b"/>
  <text class="t" x="32" y="40" font-size="19" font-weight="700" fill="#ededee">1 &#183; Veil catches the read</text>
  <text class="t sub" x="32" y="61" font-size="12.5">It wraps the page's own fetch, reads which account the read is for, and blinds the id.</text>

  <path id="f1" d="M70 132 H 700" fill="none" stroke="none"/>
  <g><circle r="4.5" fill="#ededee"/><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#f1"/></animateMotion></g>

  <g class="t">
    <rect class="box" x="30" y="108" width="178" height="50" rx="11"/>
    <text class="lbl" x="119" y="130" font-size="13" text-anchor="middle">dapp page</text>
    <text class="sub m" x="119" y="147" font-size="10" text-anchor="middle">fetch( eth_call )</text>

    <rect class="box" x="250" y="108" width="200" height="50" rx="11"/>
    <text class="lbl" x="350" y="130" font-size="13" text-anchor="middle">Veil interceptor</text>
    <text class="sub" x="350" y="147" font-size="10.5" text-anchor="middle">wraps fetch and XHR</text>

    <rect class="box" x="492" y="108" width="238" height="50" rx="11"/>
    <text class="lbl" x="611" y="130" font-size="13" text-anchor="middle">Veil router</text>
    <text class="sub" x="611" y="147" font-size="10.5" text-anchor="middle">pick the account &#183; blind the id</text>
  </g>
  <g fill="#454b54">
    <path d="M208 133 l14 0 M216 129 l6 4 -6 4"/>
    <path d="M450 133 l14 0 M458 129 l6 4 -6 4"/>
  </g>
</svg>
