<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 340" width="820" height="340" role="img" aria-label="One route per account: each account's traffic flows through its own Tor circuit to a different exit.">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36e39a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36e39a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#36e39a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t  { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .title { font-weight: 700; fill: #eef3f8; }
      .sub { fill: #9aa7b7; }
      .faint { fill: #63707f; }
      .card { fill: #121820; stroke: #242c38; }
    </style>
  </defs>

  <rect x="0" y="0" width="820" height="340" rx="18" fill="#06090d"/>
  <rect x="0.5" y="0.5" width="819" height="339" rx="17.5" fill="none" stroke="#1b2531"/>

  <!-- heading -->
  <text class="t title" x="34" y="40" font-size="21">One route per account</text>
  <text class="t sub" x="34" y="63" font-size="13">Each account gets its own Tor circuit and exit, so providers see strangers.</text>

  <!-- middle Tor band -->
  <rect x="392" y="92" width="56" height="212" fill="url(#band)"/>
  <text class="mono sub" x="420" y="108" font-size="11" text-anchor="middle">via Tor</text>
  <text class="mono faint" x="420" y="300" font-size="10" text-anchor="middle">anon-rpc</text>

  <!-- routes (faint), ids for motion paths -->
  <path id="rA" d="M214,150 C 360,120 470,120 606,150" fill="none" stroke="#36e39a" stroke-width="2" stroke-opacity="0.32"/>
  <path id="rB" d="M214,210 C 360,210 470,210 606,210" fill="none" stroke="#4fd6e8" stroke-width="2" stroke-opacity="0.32"/>
  <path id="rC" d="M214,270 C 360,300 470,300 606,270" fill="none" stroke="#9a7cf0" stroke-width="2" stroke-opacity="0.32"/>

  <!-- travelling packets -->
  <g>
    <circle r="9" fill="#36e39a" opacity="0.22"/>
    <circle r="4" fill="#5cf0b0"/>
    <animateMotion dur="2.4s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#rA"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#4fd6e8" opacity="0.22"/>
    <circle r="4" fill="#7fe6f5"/>
    <animateMotion dur="2.9s" begin="-0.6s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#rB"/></animateMotion>
  </g>
  <g>
    <circle r="9" fill="#9a7cf0" opacity="0.22"/>
    <circle r="4" fill="#b9a3f7"/>
    <animateMotion dur="2.6s" begin="-1.2s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#rC"/></animateMotion>
  </g>

  <!-- account nodes (left) -->
  <g class="t">
    <!-- A -->
    <rect class="card" x="34" y="128" width="180" height="44" rx="11"/>
    <circle cx="60" cy="150" r="11" fill="#36e39a"/>
    <text x="80" y="146" font-size="13" fill="#eef3f8" font-weight="600">Main</text>
    <text class="mono" x="80" y="162" font-size="10" fill="#63707f">0x28c6…1d60</text>
    <!-- B -->
    <rect class="card" x="34" y="188" width="180" height="44" rx="11"/>
    <circle cx="60" cy="210" r="11" fill="#4fd6e8"/>
    <text x="80" y="206" font-size="13" fill="#eef3f8" font-weight="600">Trading</text>
    <text class="mono" x="80" y="222" font-size="10" fill="#63707f">0xd8dA…6045</text>
    <!-- C -->
    <rect class="card" x="34" y="248" width="180" height="44" rx="11"/>
    <circle cx="60" cy="270" r="11" fill="#9a7cf0"/>
    <text x="80" y="266" font-size="13" fill="#eef3f8" font-weight="600">Airdrops</text>
    <text class="mono" x="80" y="282" font-size="10" fill="#63707f">0x21a3…5549</text>
  </g>

  <!-- exit nodes (right) -->
  <g class="t">
    <rect class="card" x="606" y="128" width="180" height="44" rx="11"/>
    <circle cx="628" cy="150" r="6" fill="#36e39a"><animate attributeName="opacity" values="0.45;1;0.45" dur="2s" repeatCount="indefinite"/></circle>
    <text class="mono" x="644" y="146" font-size="12" fill="#eef3f8">171.25.193.78</text>
    <text x="644" y="162" font-size="9.5" fill="#63707f">Tor exit</text>

    <rect class="card" x="606" y="188" width="180" height="44" rx="11"/>
    <circle cx="628" cy="210" r="6" fill="#4fd6e8"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.3s" repeatCount="indefinite"/></circle>
    <text class="mono" x="644" y="206" font-size="12" fill="#eef3f8">45.9.168.92</text>
    <text x="644" y="222" font-size="9.5" fill="#63707f">Tor exit</text>

    <rect class="card" x="606" y="248" width="180" height="44" rx="11"/>
    <circle cx="628" cy="270" r="6" fill="#9a7cf0"><animate attributeName="opacity" values="0.45;1;0.45" dur="2.6s" repeatCount="indefinite"/></circle>
    <text class="mono" x="644" y="266" font-size="12" fill="#eef3f8">185.220.101.98</text>
    <text x="644" y="282" font-size="9.5" fill="#63707f">Tor exit</text>
  </g>

  <!-- caption -->
  <text class="t faint" x="410" y="326" font-size="12" text-anchor="middle">A provider sees three unrelated strangers, not one person.</text>
</svg>
